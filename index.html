<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Hidden Side - Prototype</title>

<style>
body {
  margin: 0;
  background: #000;
  font-family: 'Hiragino Sans','Noto Sans JP', sans-serif;
  color: #fff;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 16px;
  backdrop-filter: blur(8px);
}

h1 {
  text-align: center;
  margin-bottom: 20px;
  font-weight: 300;
  letter-spacing: 2px;
  color: #7bb4ff;
  text-shadow: 0 0 10px #1a3b6f;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  max-height: 70vh;
  padding-right: 10px;
}

.message {
  margin: 12px 0;
  line-height: 1.7;
}

.user {
  text-align: right;
  color: #a8d0ff;
}

.ai {
  text-align: left;
  color: #e2e8f0;
}

.input-area {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 8px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: #fff;
}

button {
  padding: 14px 18px;
  background: #1a3b6f;
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 0 10px #1a3b6f;
}

button:hover {
  background: #244b91;
}
</style>

</head>
<body>
<div class="container">
  <h1>My Hidden Side</h1>

  <div class="chat-box" id="chat"></div>

  <div class="input-area">
    <input id="input" type="text" placeholder="あなたの気持ちを書いてください…" />
    <button onclick="sendMessage()">送信</button>
  </div>
</div>

<script>
const API_KEY = "const API_KEY = "YOUR_API_KEY";
";  // ←ここを自分のAPIキーに書き換える！

// AIの性格（あなたの世界観に合わせたプロンプト）
const systemPrompt = `
あなたは利用者の内面に寄り添い、静かに問いを返すAIです。
安心できるテンポで、押し付けず、相手の感覚に寄り添ってください。
否定や断定を避け、「気づき」を深める方向に導いてください。
感情を評価せず、「そのまま受け止める」姿勢を大切にしてください。
語尾は柔らかく、落ち着いたトーンで話してください。
`;

function addMessage(text, sender) {
  const chat = document.getElementById("chat");
  const msg = document.createElement("div");
  msg.className = `message ${sender}`;
  msg.textContent = text;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("input");
  const userText = input.value.trim();
  if (!userText) return;

  addMessage(userText, "user");
  input.value = "";

  addMessage("…考えています…", "ai");

  const response = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${API_KEY}`
    },
    body: JSON.stringify({
      model: "gpt-4o-mini",   // 軽くて速いモデル
      messages: [
        { role: "system", content: systemPrompt },
        { role: "user", content: userText }
      ]
    })
  });

  const data = await response.json();
  const aiText = data.choices[0].message.content;

  // 「考えています…」を消す
  const chat = document.getElementById("chat");
  chat.removeChild(chat.lastChild);

  addMessage(aiText, "ai");
}
</script>

</body>
</html>
